name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site (game only, without dev tools)
        run: |
          mkdir _site
          cp -R game/. _site/
          rm -rf _site/tools
          cp LICENSE _site/LICENSE.txt
          cp "Kétharmad.html" _site/
          sed -i 's#\.\./Kétharmad\.html#Kétharmad.html#g' _site/ui.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
